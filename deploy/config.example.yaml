# Folio 服务端配置。复制成同目录下的 config.yaml 再填写：cp config.example.yaml config.yaml
# 这个文件里有 Folio 所有的密钥，不要提交到 git，也不要发给别人。
# 第一次 docker compose up 之前就要建好这个文件（否则 Docker 会建一个同名文件夹）。
# 改完后执行 docker compose up -d --force-recreate server，服务端重建后生效。
# 键名写错或者值不对，服务端会拒绝启动，并在日志里写明是哪一项（docker compose logs server）。

# Folio 的访问地址，末尾不要加斜杠。
#   有域名以后：https://<你的域名>（Cloudflare 代理）
#   还没有域名、用 IP 测试：http://<VPS 的 IP>:8080（端口和 docker-compose.yml 里的一致）
site_url: https://folio.example.com

# 走 HTTPS 时为 true。用 IP 走 http 测试时必须为 false，否则浏览器不保存官网的登录 Cookie，注册、登录走不通。
cookie_secure: true

# 32 字节的随机密钥，生成：openssl rand -base64 32
# 代理密码、保存的登录状态、扩展签名都依赖它。开始使用后永远不要改，否则这些数据都读不出来。
secret_key: ""

# Cloudflare R2：建一个桶，再建一个对这个桶有「对象读和写」权限的 API 令牌。
s3:
  endpoint: https://<账户 ID>.r2.cloudflarestorage.com
  region: auto
  bucket: folio
  access_key_id: ""
  secret_access_key: ""

# 发信（注册验证码、找回密码、团队邀请），任何 SMTP 服务都可以。必填，没填服务端不会启动。
smtp:
  url: smtps://用户名:密码@smtp.example.com:465
  from: Folio <no-reply@folio.example.com>

# 模拟支付：false 时付费套餐显示「即将开放」。只在测试服务器上设 true，可以用测试卡 4242 4242 4242 4242「购买」，
# 体验付费功能。正式上线前改回 false。
mock_payments: false

# 下面几项和 docker-compose.yml 配套，保持不变即可。
# 数据库只在 compose 内部网络里，不对外开放；要改密码，这里和 docker-compose.yml 的 POSTGRES_PASSWORD 一起改。
database_url: postgres://folio:folio@postgres:5432/folio
# 只有官网容器（nginx）能访问服务端，由它转交访客的真实 IP。
trust_proxy: uniquelocal
# IP 归属地数据库，镜像里自带。
geoip_db: /app/geoip/dbip-city-lite.mmdb
