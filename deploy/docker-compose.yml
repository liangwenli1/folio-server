# Folio on one server: PostgreSQL, the API and the site. Cloudflare serves the domain over HTTPS and connects to
# FOLIO_PORT; the site container answers there and passes /api/ on to the API. Object storage is Cloudflare R2.
# Copy this folder to the server, fill in .env from .env.example, then: docker compose up -d
name: folio

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: folio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "folio"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  server:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/folio-server:${FOLIO_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://folio:${POSTGRES_PASSWORD}@postgres:5432/folio
      SITE_URL: https://${FOLIO_DOMAIN:?set FOLIO_DOMAIN in .env}
      SITE_ORIGINS: https://${FOLIO_DOMAIN}
      COOKIE_SECURE: "1"
      # Only the site container reaches the API, and it passes on the visitor's address.
      TRUST_PROXY: uniquelocal
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      MOCK_PAYMENTS: ${MOCK_PAYMENTS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  site:
    image: ghcr.io/${GHCR_OWNER}/folio-site:${FOLIO_VERSION:-latest}
    ports:
      - "${FOLIO_PORT:-8080}:8080"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
