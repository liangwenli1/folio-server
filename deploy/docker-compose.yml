# Folio on one server: PostgreSQL, the API and the site. Cloudflare serves the domain over HTTPS and connects to the
# site container's port (before there is a domain, people can connect to that port directly by IP, for testing); the
# site container passes /api/ on to the API. Object storage is Cloudflare R2.
#
# Before the first start: put your GitHub user or organization (lower case) in both image lines, and create
# config.yaml next to this file from config.example.yaml. Then: docker compose up -d
# Image tags: latest (the newest v* tag), a version such as v0.1.0, or main (the newest push to main).
name: folio

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: folio
      # Only reachable inside this compose network. To change it, change database_url in config.yaml too.
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "folio"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  server:
    image: ghcr.io/your-github-name/folio-server:latest
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  site:
    image: ghcr.io/your-github-name/folio-site:latest
    # The port on this server that Cloudflare (or, while testing, the browser) connects to: "<port>:8080".
    ports:
      - "8080:8080"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
